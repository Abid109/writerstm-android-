    <script>
        // MALWARE & REDIRECT SHIELD
        const originalWindowOpen = window.open;
        window.open = function(url, windowName, windowFeatures) {
            console.warn("Writerstm Security Shield blocked an unauthorized popup attempt to:", url);
            return null; 
        };

        let isUserIntentionalClick = false;
        window.addEventListener('mousedown', () => { isUserIntentionalClick = true; setTimeout(() => isUserIntentionalClick = false, 1500); });
        window.addEventListener('keydown', () => { isUserIntentionalClick = true; setTimeout(() => isUserIntentionalClick = false, 1500); });
        
        window.addEventListener('beforeunload', (e) => {
            if (!isUserIntentionalClick && document.activeElement && document.activeElement.tagName === 'IFRAME') {
                e.preventDefault();
                e.returnValue = 'Warning: A third-party stream attempted to redirect you. Stay safe!';
                return e.returnValue;
            }
        });

        // Global Error Handler to prevent silent blank screens
        window.onerror = function(message, source, lineno, colno, error) {
            console.error("Global script error:", message, "at line:", lineno);
            // We don't block the whole screen, but log it so other scripts might still run
            return false; 
        };
    </script>

        let currentCategory = 'trending';
        let currentGenre = '';
        let currentQuery = '';
        let currentPage = 1;
        let isWatchlistView = false;
        let watchlist = [];
        
        let currentMediaId = null;
        let currentMediaObj = null; 
        let currentSeason = 1;
        let currentEpisode = 1;
        let currentAudioType = 'sub';
        let currentDirectUrl = null; 

        // DOM Elements mapping safely
        const $ = (id) => document.getElementById(id);
        const mediaGrid = $('mediaGrid');
        const mainLoader = $('mainLoader');
        const searchInput = $('searchInput');
        const mobileSearchInput = $('mobileSearchInput');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const categoryFilter = $('categoryFilter');
        const genreFilter = $('genreFilter');
        const sectionTitle = $('sectionTitle');
        const viewWatchlistBtn = $('viewWatchlistBtn');
        const clearWatchlistBtn = $('clearWatchlistBtn');
        
        const pagination = $('pagination');
        const prevPageBtn = $('prevPageBtn');
        const nextPageBtn = $('nextPageBtn');
        const pageIndicator = $('pageIndicator');

        const playerModal = $('playerModal');
        const closeModalBtn = $('closeModal');
        const videoFrame = $('videoFrame');
        const playerLoader = $('playerLoader');
        const loaderMessage = $('loaderMessage');
        const scraperContainer = $('scraperContainer');
        const modalTitle = $('modalTitle');
        const modalBookmarkBtn = $('modalBookmarkBtn');
        const streamStatus = $('streamStatus');
        
        const videoContainer = $('videoContainer');
        const clickShield = $('clickShield');
        const adBlockToggle = $('adBlockToggle');
        const fullscreenBtn = $('fullscreenBtn');
        const externalPlayerBtn = $('externalPlayerBtn');
        const floatingExitBtn = $('floatingExitBtn');
        
        let isAdShieldActive = true; 
        let playerHistoryPushed = false; // tracks back-button history entry for the player modal

        // ===== Back-button navigation system (History API) =====
        function getAppState() {
            return { type: currentType, category: currentCategory, genre: currentGenre || '', query: currentQuery || '', page: currentPage || 1, watchlist: !!isWatchlistView };
        }

        function pushAppState(s) {
            try { history.pushState({ writerstm: 'app', app: s }, ''); } catch (err) {}
        }

        async function applyAppState(s) {
            currentType = s.type; currentCategory = s.category; currentGenre = s.genre || '';
            currentQuery = s.query || ''; currentPage = s.page || 1; isWatchlistView = !!s.watchlist;

            tabBtns.forEach(b => {
                if (b.dataset.type === currentType) {
                    b.classList.add('bg-red-600', 'text-white', 'shadow-sm'); b.classList.remove('text-zinc-400');
                } else {
                    b.classList.remove('bg-red-600', 'text-white', 'shadow-sm'); b.classList.add('text-zinc-400');
                }
            });

            let ph = "Search movies...";
            if(currentType === 'tv') ph = "Search TV series...";
            if(currentType === 'anime') ph = "Search anime...";
            if(currentType === 'archive') ph = "Search public domain films...";
            if (searchInput) { searchInput.placeholder = ph; searchInput.value = currentQuery; }
            if (mobileSearchInput) { mobileSearchInput.placeholder = ph; mobileSearchInput.value = currentQuery; }

            if (categoryFilter) { categoryFilter.value = currentCategory; categoryFilter.disabled = isWatchlistView; categoryFilter.classList.toggle('opacity-50', isWatchlistView); }
            if (genreFilter) { genreFilter.disabled = isWatchlistView; genreFilter.classList.toggle('opacity-50', isWatchlistView); }
            if (clearWatchlistBtn) clearWatchlistBtn.classList.toggle('hidden', !isWatchlistView);
            if (pagination) pagination.classList.toggle('hidden', isWatchlistView);
            if (sectionTitle && isWatchlistView) sectionTitle.textContent = "My Watchlist";

            await loadGenres();
            if (genreFilter) genreFilter.value = currentGenre;

            updateWatchlistUI();
            if (isWatchlistView) renderGrid(watchlist);
            else fetchMedia();
        }

        function navigateApp() {
            const s = getAppState();
            applyAppState(s);
            pushAppState(s);
        }
        
        const serverSelect = $('serverSelect');
        const audioSubBtn = $('audio-sub');
        const audioDubBtn = $('audio-dub');
        const dubLangSelect = $('dub-lang-select');
        
        const tvSidebar = $('tvSidebar');
        const seasonSelect = $('seasonSelect');
        const episodeList = $('episodeList');

        // Safe storage check to prevent fatal SecurityErrors in restricted webviews
        function safeStorageAccess() {
            try {
                localStorage.setItem('__test__', '__test__');
                localStorage.removeItem('__test__');
                return true;
            } catch(e) { return false; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                loadWatchlist();
                loadGenres();
                fetchMedia();
                
                if(safeStorageAccess()) {
                    const pref = localStorage.getItem('writerstm_preferred_server');
                    if (pref && serverSelect) {
                        serverSelect.value = pref;
                    }
                }
                
                try { history.replaceState({ writerstm: 'app', app: getAppState() }, ''); } catch(e) {}
                setTimeout(() => {
                    showToast("🛡️ Security Shield Active: Blocking Malware & Popups", 4000);
                }, 1500);
            } catch (err) {
                console.error("Initialization Error:", err);
                if (mediaGrid) {
                    mediaGrid.innerHTML = `<div class="col-span-full text-center text-red-500 py-10 bg-red-950/20 rounded-xl border border-red-900"><i class="ph-fill ph-warning-circle text-4xl mb-3 block mx-auto"></i><p class="font-semibold text-lg">Failed to initialize application.</p><p class="text-sm mt-2 opacity-80">This might be due to strict browser privacy settings or a blocked script.</p></div>`;
                }
            }
        });
        
        if (serverSelect) {
            serverSelect.addEventListener('change', (e) => {
                if (safeStorageAccess()) {
                    localStorage.setItem('writerstm_preferred_server', e.target.value);
                }
                currentDirectUrl = null; 
                updateStreamIframe();
            });
        }
        
        function loadWatchlist() {
            if (safeStorageAccess()) {
                try {
                    const stored = localStorage.getItem('writerstm_watchlist');
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if(Array.isArray(parsed)) watchlist = parsed;
                    }
                } catch(e) { watchlist = []; }
            }
            updateWatchlistUI();
        }

        function saveWatchlist() {
            if (safeStorageAccess()) localStorage.setItem('writerstm_watchlist', JSON.stringify(watchlist));
        }

        function toggleBookmark(mediaItem, event) {
            if(event) event.stopPropagation();
            const index = watchlist.findIndex(item => item.id === mediaItem.id && item.type === mediaItem.type);
            if (index > -1) watchlist.splice(index, 1);
            else watchlist.push(mediaItem);
            
            saveWatchlist();
            if (isWatchlistView) renderGrid(watchlist);
            else {
                const gridBtn = document.querySelector(`.grid-bookmark[data-id="${mediaItem.id}"]`);
                if(gridBtn) {
                    if (index > -1) gridBtn.classList.remove('active');
                    else gridBtn.classList.add('active');
                }
            }
            updateWatchlistUI();
            if(currentMediaObj && currentMediaObj.id === mediaItem.id) updateModalBookmarkBtn();
        }
        
        function updateWatchlistUI() {
            if (!viewWatchlistBtn) return;
            const count = watchlist.length;
            viewWatchlistBtn.innerHTML = `
                <i class="ph-fill ph-bookmarks text-xl ${isWatchlistView ? 'text-red-600 drop-shadow-[0_0_5px_rgba(220,38,38,0.8)]' : ''}"></i>
                <span class="hidden sm:inline text-sm font-medium ${isWatchlistView ? 'text-white' : ''}">Watchlist ${count > 0 ? `(${count})` : ''}</span>
            `;
        }
        
        if (viewWatchlistBtn) {
            viewWatchlistBtn.addEventListener('click', () => {
                isWatchlistView = !isWatchlistView;
                currentPage = 1;
                navigateApp();
            });
        }

        if (clearWatchlistBtn) {
            clearWatchlistBtn.addEventListener('click', () => {
                if(confirm("Are you sure you want to clear your watchlist?")) {
                    watchlist = []; saveWatchlist(); renderGrid(watchlist); updateWatchlistUI();
                }
            });
        }

        async function loadGenres() {
            if (!genreFilter) return;
            if(currentType === 'archive') {
                populateGenreSelect([
                    {id: "collection:PublicDomainFilms", name: "Public Domain Films"},
                    {id: "collection:feature_films", name: "Feature Films"},
                    {id: "collection:Prelinger", name: "Prelinger Archive"},
                    {id: "collection:classic_tv", name: "Classic TV"},
                    {id: "collection:SciFi_Horror", name: "Sci-Fi & Horror"},
                    {id: "collection:Comedy_Films", name: "Comedy Films"}
                ]);
                return;
            }
            if(currentType === 'anime') {
                populateGenreSelect([
                    {id: "Action", name: "Action"}, {id: "Adventure", name: "Adventure"}, 
                    {id: "Comedy", name: "Comedy"}, {id: "Drama", name: "Drama"}, 
                    {id: "Fantasy", name: "Fantasy"}, {id: "Horror", name: "Horror"},
                    {id: "Romance", name: "Romance"}, {id: "Sci-Fi", name: "Sci-Fi"}
                ]);
            } else {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/genre/${currentType}/list?api_key=${TMDB_API_KEY}`);
                    const data = await res.json();
                    if(data && data.genres) populateGenreSelect(data.genres);
                } catch(e) { console.error("Failed to load genres:", e); }
            }
        }
        
        function populateGenreSelect(genres) {
            if (!genreFilter) return;
            genreFilter.innerHTML = '<option value="">All Genres</option>';
            genres.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id || g.name; opt.textContent = g.name;
                if(currentGenre == opt.value) opt.selected = true;
                genreFilter.appendChild(opt);
            });
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentType = e.target.dataset.type;
                isWatchlistView = false;
                currentQuery = '';
                currentGenre = ''; currentPage = 1;
                navigateApp();
            });
        });

        if (categoryFilter) categoryFilter.addEventListener('change', (e) => { currentCategory = e.target.value; currentPage = 1; navigateApp(); });
        if (genreFilter) genreFilter.addEventListener('change', (e) => { currentGenre = e.target.value; currentPage = 1; navigateApp(); });

        const handleSearch = (e) => {
            if(e.key === 'Enter') {
                currentQuery = e.target.value; currentPage = 1; isWatchlistView = false;
                navigateApp();
            }
        };
        if (searchInput) searchInput.addEventListener('keypress', handleSearch);
        if (mobileSearchInput) mobileSearchInput.addEventListener('keypress', handleSearch);
        
        if (prevPageBtn) prevPageBtn.addEventListener('click', () => { if(currentPage > 1) { currentPage--; navigateApp(); } });
        if (nextPageBtn) nextPageBtn.addEventListener('click', () => { currentPage++; navigateApp(); });

        function updateSectionTitle() {
            if(isWatchlistView || !sectionTitle) return;
            let title = '';
            if(currentQuery) title = `Search results for "${currentQuery}"`;
            else {
                let catText = categoryFilter && categoryFilter.options.length > 0 ? categoryFilter.options[categoryFilter.selectedIndex].text : '';
                let typeText = currentType === 'tv' ? 'TV Series' : currentType === 'anime' ? 'Anime' : currentType === 'archive' ? 'Public Domain Films' : 'Movies';
                title = `${catText} ${typeText}`;
                if(currentGenre && genreFilter && genreFilter.selectedIndex > 0) {
                    let genText = genreFilter.options[genreFilter.selectedIndex].text;
                    title = `${genText} ${typeText} - ${catText}`;
                }
            }
            sectionTitle.textContent = title;
        }

        async function fetchMedia() {
            if(isWatchlistView || !mediaGrid) return;
            mediaGrid.innerHTML = ''; 
            if (mainLoader) mainLoader.classList.remove('hidden'); 
            if (pagination) pagination.classList.add('hidden');
            updateSectionTitle();
            
            let url = '';
            if (currentType === 'archive') {
                let q = currentQuery ? currentQuery : 'mediatype:movies AND collection:(feature_films OR PublicDomainFilms)';
                if (currentGenre) q += ` AND ${currentGenre}`;
                if (!currentQuery && currentCategory === 'top_rated') q = `mediatype:movies AND ${currentGenre ? currentGenre + ' AND ' : ''}subject:(classic OR award)`;
                url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier&fl[]=title&fl[]=year&rows=21&page=${currentPage}&output=json`;
            } else if (currentType === 'anime') {
                let base = `https://kitsu.io/api/edge/anime?page[limit]=20&page[offset]=${(currentPage-1)*20}`;
                if (currentQuery) url = `${base}&filter[text]=${encodeURIComponent(currentQuery)}`;
                else {
                    if (currentGenre) base += `&filter[categories]=${encodeURIComponent(currentGenre)}`;
                    if (currentCategory === 'trending') url = currentGenre ? `${base}&sort=-userCount` : `https://kitsu.io/api/edge/trending/anime?page[limit]=20`;
                    else if (currentCategory === 'popular') url = `${base}&sort=-userCount`;
                    else url = `${base}&sort=-averageRating`;
                }
            } else {
                if (currentQuery) url = `https://api.themoviedb.org/3/search/${currentType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(currentQuery)}&page=${currentPage}`;
                else {
                    let endpoint = currentCategory === 'trending' ? `trending/${currentType}/week` : currentCategory === 'popular' ? `${currentType}/popular` : `${currentType}/top_rated`;
                    url = `https://api.themoviedb.org/3/${endpoint}?api_key=${TMDB_API_KEY}&page=${currentPage}`;
                    if(currentGenre) url += `&with_genres=${currentGenre}`;
                }
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                let results = [], totalPages = 1;
                
                if (currentType === 'archive') {
                    results = (data.response && data.response.docs) || [];
                    if(data.response && data.response.numFound) totalPages = Math.min(Math.ceil(data.response.numFound / 21), 100);
                } else if (currentType === 'anime') {
                    results = data.data || [];
                    if(data.meta && data.meta.count) totalPages = Math.ceil(data.meta.count / 20);
                } else {
                    results = data.results || [];
                    totalPages = data.total_pages || 1;
                }
                
                if (mainLoader) mainLoader.classList.add('hidden');
                renderGrid(results, true);
                
                if(totalPages > 1 && !isWatchlistView && pagination) {
                    pagination.classList.remove('hidden');
                    if (pageIndicator) pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
                    if (prevPageBtn) prevPageBtn.disabled = currentPage === 1;
                    if (nextPageBtn) nextPageBtn.disabled = currentPage >= totalPages;
                }
            } catch (error) {
                console.error("Fetch error", error); 
                if (mainLoader) mainLoader.classList.add('hidden');
                mediaGrid.innerHTML = `<p class="col-span-full text-center text-red-500 py-10"><i class="ph-fill ph-warning-circle text-2xl mb-2"></i><br>Error loading media. Please try again.</p>`;
            }
        }

        function formatMediaItem(rawItem) {
            let item = { ...rawItem, originalType: currentType };
            if (rawItem.originalType) return rawItem;
            if (currentType === 'archive') {
                item.id = rawItem.identifier; item.type = 'archive'; item.originalType = 'archive';
                item.title = rawItem.title || 'Untitled';
                item.poster = `https://archive.org/services/img/${rawItem.identifier}`;
                item.year = rawItem.year || 'N/A'; item.rating = 'N/A';
            } else if (currentType === 'anime') {
                item.id = rawItem.id; item.type = 'anime';
                item.title = rawItem?.attributes?.titles?.en || rawItem?.attributes?.titles?.en_jp || rawItem?.attributes?.canonicalTitle || "Unknown Anime";
                item.poster = rawItem?.attributes?.posterImage?.large || '';
                item.year = rawItem?.attributes?.startDate ? rawItem.attributes.startDate.split('-')[0] : 'N/A';
                item.rating = rawItem?.attributes?.averageRating ? (parseFloat(rawItem.attributes.averageRating) / 10).toFixed(1) : 'N/A';
            } else {
                item.id = rawItem.id; item.type = currentType;
                item.title = rawItem.title || rawItem.name;
                item.poster = rawItem.poster_path ? `https://image.tmdb.org/t/p/w500${rawItem.poster_path}` : '';
                item.year = (rawItem.release_date || rawItem.first_air_date || 'N/A').split('-')[0];
                item.rating = rawItem.vote_average ? rawItem.vote_average.toFixed(1) : 'N/A';
            }
            return item;
        }

        function renderGrid(items, needsFormatting = false) {
            if (!mediaGrid) return;
            mediaGrid.innerHTML = '';
            if (!items || items.length === 0) { mediaGrid.innerHTML = `<p class="col-span-full text-center text-zinc-500 py-10">No results found.</p>`; return; }
            
            // Fragment for better performance
            const fragment = document.createDocumentFragment();

            items.forEach(rawItem => {
                const item = needsFormatting ? formatMediaItem(rawItem) : rawItem;
                if(!item.poster) return;
                const isSaved = watchlist.some(w => w.id === item.id && w.type === item.type);
                const card = document.createElement('div');
                card.className = "group cursor-pointer flex flex-col gap-2 relative rounded-xl outline-none focus-visible:ring-4 focus-visible:ring-red-600 focus-visible:ring-offset-4 focus-visible:ring-offset-black transition-shadow";
                card.tabIndex = 0; 
                card.addEventListener('keydown', (e) => { if(e.key === 'Enter') openPlayer(item); });
                card.onclick = () => openPlayer(item);

                card.innerHTML = `
                    <div class="relative aspect-[2/3] overflow-hidden rounded-xl bg-zinc-900 border border-zinc-800 group-hover:border-red-600 transition-colors">
                        <img src="${item.poster}" alt="${item.title}" loading="lazy" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center">
                            <i class="ph-fill ph-play-circle text-5xl sm:text-6xl text-red-600 drop-shadow-[0_0_10px_rgba(220,38,38,0.8)] mb-2"></i>
                        </div>
                        <div class="absolute top-2 w-full px-2 flex justify-between items-start pointer-events-none">
                            <div class="bg-black/80 backdrop-blur border border-zinc-800 text-white text-xs sm:text-sm font-bold px-2 py-1 rounded-md flex items-center gap-1">
                                <i class="ph-fill ph-star text-red-500"></i> ${item.rating}
                            </div>
                            <button class="grid-bookmark bookmark-btn pointer-events-auto p-2 sm:p-2.5 bg-black/80 border border-zinc-800 rounded-md text-zinc-400 hover:text-white ${isSaved ? 'active' : ''}" data-id="${item.id}" tabindex="0">
                                <i class="ph ph-bookmark text-sm sm:text-base"></i>
                            </button>
                        </div>
                        ${item.type === 'anime' ? `<div class="absolute bottom-2 left-2 bg-red-600 text-white text-[10px] sm:text-xs font-bold px-1.5 py-0.5 rounded uppercase">Anime</div>` : ''}
                        ${item.type === 'archive' ? `<div class="absolute bottom-2 left-2 bg-green-600 text-white text-[10px] sm:text-xs font-bold px-1.5 py-0.5 rounded uppercase">Direct</div>` : ''}
                    </div>
                    <div class="px-1">
                        <h3 class="font-semibold text-sm sm:text-base text-white line-clamp-1 group-hover:text-red-400">${item.title}</h3>
                        <p class="text-xs sm:text-sm text-zinc-500">${item.year} &bull; ${item.type === 'movie' ? 'Movie' : item.type === 'archive' ? 'Public Domain' : 'TV Series'}</p>
                    </div>
                `;
                const btn = card.querySelector('.grid-bookmark');
                if (btn) {
                    btn.onclick = (e) => toggleBookmark(item, e);
                    btn.addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.stopPropagation(); toggleBookmark(item, e); } });
                }
                fragment.appendChild(card);
            });
            mediaGrid.appendChild(fragment);
        }
        
        function updateModalBookmarkBtn() {
            if(!currentMediaObj || !modalBookmarkBtn) return;
            if(watchlist.some(w => w.id === currentMediaObj.id && w.type === currentMediaObj.type)) modalBookmarkBtn.classList.add('active');
            else modalBookmarkBtn.classList.remove('active');
        }
        if (modalBookmarkBtn) modalBookmarkBtn.onclick = () => { if(currentMediaObj) toggleBookmark(currentMediaObj); };

        async function getTmdbIdForAnime(animeTitle) {
            try {
                const cleanTitle = animeTitle.split(':')[0].split('-')[0].trim();
                const searchUrl = `https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(cleanTitle)}`;
                const res = await fetch(searchUrl);
                const data = await res.json();
                if(data.results && data.results.length > 0) return data.results[0].id; 
            } catch (e) {} return null; 
        }

        async function playArchiveItem(item) {
            if (streamStatus) streamStatus.innerHTML = `<i class="ph ph-spinner animate-spin"></i> Finding direct video file...`;
            try {
                const res = await fetch(`https://archive.org/metadata/${encodeURIComponent(item.id)}`);
                const meta = await res.json();
                const vids = (meta.files || []).filter(f => !f.private && /\.(mp4|webm|m4v|mov|avi|mkv)$/i.test(f.name));
                if (!vids.length) throw new Error('no video files');
                vids.sort((x, y) => (parseInt(y.size) || 0) - (parseInt(x.size) || 0));
                const pick = vids.find(f => /\.mp4$/i.test(f.name)) || vids[0];
                currentDirectUrl = `https://archive.org/download/${item.id}/${encodeURIComponent(pick.name)}`;
                currentMediaId = item.id;
                updateStreamIframe();
            } catch (e) {
                if (playerLoader) playerLoader.classList.add('hidden');
                if (streamStatus) streamStatus.innerHTML = `<i class="ph-fill ph-warning-circle text-red-500"></i> <span class="text-red-400">No direct video found</span>`;
            }
        }

        async function openPlayer(item) {
            if (!playerModal) return;
            currentMediaObj = item; updateModalBookmarkBtn(); currentDirectUrl = null;
            if (modalTitle) modalTitle.textContent = item.title;
            
            playerModal.classList.remove('hidden'); 
            try { history.pushState({ writerstm: 'player' }, ''); playerHistoryPushed = true; } catch(e) {}
            if (videoFrame) videoFrame.classList.add('hidden');
            if (scraperContainer) scraperContainer.classList.add('hidden');
            
            const dMsg = document.getElementById('directPlayMsg');
            if (dMsg) dMsg.remove();
            
            if (playerLoader) playerLoader.classList.remove('hidden'); 
            if (tvSidebar) tvSidebar.classList.add('hidden');
            if (loaderMessage) loaderMessage.textContent = "Loading media engine...";
            if (streamStatus) {
                streamStatus.innerHTML = `<i class="ph ph-spinner animate-spin"></i> Connecting to stream...`;
                streamStatus.className = "flex items-center gap-1.5 text-zinc-500 text-xs";
            }

            if (item.type === 'archive') { await playArchiveItem(item); return; }

            currentMediaId = item.id;
            let actualType = item.type;

            if (item.type === 'anime') {
                const tmdbId = await getTmdbIdForAnime(item.title);
                if (tmdbId) { currentMediaId = tmdbId; actualType = 'tv'; } 
                else {
                    if (streamStatus) streamStatus.innerHTML = `<i class="ph-fill ph-warning-circle text-red-500"></i> <span class="text-red-400">Stream not found</span>`;
                    if (playerLoader) playerLoader.classList.add('hidden'); return;
                }
            }

            if (actualType === 'tv') {
                if (tvSidebar) { tvSidebar.classList.remove('hidden'); tvSidebar.classList.add('flex'); }
                await loadTvDetails(currentMediaId);
            } else { updateStreamIframe(); }
        }

        if (closeModalBtn) {
            closeModalBtn.addEventListener('click', () => {
                if (playerHistoryPushed) { playerHistoryPushed = false; history.back(); return; }
                if (playerModal) playerModal.classList.add('hidden'); 
                if (videoFrame) videoFrame.src = ''; 
                currentMediaObj = null; currentDirectUrl = null;
                
                if (videoContainer) videoContainer.classList.remove('webview-fullscreen', 'force-landscape');
                if (fullscreenBtn) fullscreenBtn.innerHTML = `<i class="ph ph-corners-out text-base"></i> <span class="hidden sm:inline">Fullscreen</span>`;
                
                const dMsg = document.getElementById('directPlayMsg');
                if (dMsg) dMsg.remove();
            });
        }

        async function loadTvDetails(id) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                if (!seasonSelect) return;
                seasonSelect.innerHTML = '';
                const seasons = data.seasons.filter(s => s.season_number > 0);
                seasons.forEach(s => {
                    const opt = document.createElement('option'); opt.value = s.season_number; opt.textContent = `Season ${s.season_number}`; seasonSelect.appendChild(opt);
                });
                if(seasons.length > 0) { currentSeason = seasons[0].season_number; await loadEpisodes(id, currentSeason); }
            } catch (e) { console.error("Error loading TV details:", e); }
        }

        async function loadEpisodes(id, seasonNumber) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${id}/season/${seasonNumber}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                if (!episodeList) return;
                episodeList.innerHTML = '';
                data.episodes.forEach(ep => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-4 py-3 rounded-lg text-sm sm:text-base transition-colors text-zinc-400 hover:bg-zinc-900 hover:text-white border border-transparent hover:border-zinc-800 focus:outline-none focus:ring-2 focus:ring-red-600";
                    btn.innerHTML = `<span class="font-mono text-zinc-500 mr-2">${ep.episode_number}.</span> ${ep.name}`;
                    if(ep.episode_number === 1) {
                        btn.classList.add('bg-red-600', 'text-white', 'border-red-500'); btn.classList.remove('text-zinc-400', 'border-transparent', 'hover:border-zinc-800', 'hover:bg-zinc-900');
                    }
                    btn.onclick = () => {
                        episodeList.querySelectorAll('button').forEach(b => {
                            b.classList.remove('bg-red-600', 'text-white', 'border-red-500'); b.classList.add('text-zinc-400', 'border-transparent', 'hover:border-zinc-800', 'hover:bg-zinc-900');
                        });
                        btn.classList.add('bg-red-600', 'text-white', 'border-red-500'); btn.classList.remove('text-zinc-400', 'border-transparent', 'hover:border-zinc-800', 'hover:bg-zinc-900');
                        currentEpisode = ep.episode_number;
                        currentDirectUrl = null; 
                        updateStreamIframe();
                    };
                    episodeList.appendChild(btn);
                });
                currentEpisode = 1; updateStreamIframe();
            } catch (e) { console.error("Error loading episodes:", e); }
        }

        if (audioSubBtn && audioDubBtn && dubLangSelect) {
            audioSubBtn.addEventListener('click', () => {
                currentAudioType = 'sub';
                audioSubBtn.classList.add('bg-red-600', 'text-white'); audioSubBtn.classList.remove('text-zinc-400');
                audioDubBtn.classList.remove('bg-red-600', 'text-white'); audioDubBtn.classList.add('text-zinc-400');
                dubLangSelect.classList.add('hidden'); updateStreamIframe();
            });
            audioDubBtn.addEventListener('click', () => {
                currentAudioType = 'dub';
                audioDubBtn.classList.add('bg-red-600', 'text-white'); audioDubBtn.classList.remove('text-zinc-400');
                audioSubBtn.classList.remove('bg-red-600', 'text-white'); audioSubBtn.classList.add('text-zinc-400');
                dubLangSelect.classList.remove('hidden'); updateStreamIframe();
            });
            dubLangSelect.addEventListener('change', () => { if(currentAudioType === 'dub') updateStreamIframe(); });
        }
        
        if (seasonSelect) seasonSelect.addEventListener('change', (e) => { currentSeason = e.target.value; currentDirectUrl = null; loadEpisodes(currentMediaId, currentSeason); });

        if (clickShield && videoFrame) {
            clickShield.addEventListener('click', (e) => {
                e.preventDefault(); clickShield.classList.add('resolved');
                setTimeout(() => { videoFrame.focus(); }, 100);
            });
        }

        if (adBlockToggle) {
            adBlockToggle.addEventListener('click', () => {
                isAdShieldActive = !isAdShieldActive;
                if(isAdShieldActive) {
                    adBlockToggle.className = "flex items-center gap-1.5 px-2.5 py-1.5 bg-green-900/30 text-green-500 border border-green-900 rounded-md text-xs font-semibold uppercase tracking-wider hover:bg-green-900/50 transition-colors";
                    adBlockToggle.innerHTML = `<i class="ph-fill ph-shield-check text-base"></i> <span class="hidden sm:inline">Ad-Shield On</span>`;
                    showToast("🛡️ Strict Sandbox Enabled: Blocking popups and downloads");
                } else {
                    adBlockToggle.className = "flex items-center gap-1.5 px-2.5 py-1.5 bg-zinc-800 text-zinc-400 border border-zinc-700 rounded-md text-xs font-semibold uppercase tracking-wider hover:bg-zinc-700 transition-colors";
                    adBlockToggle.innerHTML = `<i class="ph ph-shield text-base"></i> <span class="hidden sm:inline">Ad-Shield Off</span>`;
                    showToast("⚠️ Security reduced. Popups may occur.", 3000);
                }
                updateStreamIframe(); 
            });
        }

        if (fullscreenBtn && videoContainer) {
            fullscreenBtn.addEventListener('click', () => {
                const isFullscreen = videoContainer.classList.contains('webview-fullscreen') || document.fullscreenElement;
                if (!isFullscreen) {
                    videoContainer.classList.add('webview-fullscreen', 'force-landscape');
                    fullscreenBtn.innerHTML = `<i class="ph ph-corners-in text-base"></i> <span class="hidden sm:inline">Exit</span>`;
                    try {
                        if (videoContainer.requestFullscreen) videoContainer.requestFullscreen().catch(err => console.warn(err));
                        else if (videoContainer.webkitRequestFullscreen) videoContainer.webkitRequestFullscreen();
                    } catch(e) {}
                    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
                } else {
                    videoContainer.classList.remove('webview-fullscreen', 'force-landscape');
                    fullscreenBtn.innerHTML = `<i class="ph ph-corners-out text-base"></i> <span class="hidden sm:inline">Fullscreen</span>`;
                    try {
                        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();

        function getStreamUrl() {
            if (currentDirectUrl) return currentDirectUrl; 
            const server = serverSelect ? serverSelect.value : 'vidsrc_to';
            const lang = dubLangSelect ? dubLangSelect.value : 'en';
            const isTv = (currentMediaObj && (currentMediaObj.type === 'tv' || currentMediaObj.type === 'anime'));
            
            let url = "";
            if (server === 'vidsrc_to') url = isTv ? `https://vidsrc.to/embed/tv/${currentMediaId}/${currentSeason}/${currentEpisode}` : `https://vidsrc.to/embed/movie/${currentMediaId}`;
            else if (server === 'vidsrc_me') url = isTv ? `https://vidsrc.me/embed/tv?tmdb=${currentMediaId}&season=${currentSeason}&episode=${currentEpisode}` : `https://vidsrc.me/embed/movie?tmdb=${currentMediaId}`;
            else if (server === 'vidlink') url = isTv ? `https://vidlink.pro/tv/${currentMediaId}/${currentSeason}/${currentEpisode}` : `https://vidlink.pro/movie/${currentMediaId}`;
            else if (server === 'smashy') url = isTv ? `https://player.smashy.stream/tv/${currentMediaId}?s=${currentSeason}&e=${currentEpisode}` : `https://player.smashy.stream/movie/${currentMediaId}`;
            else if (server === 'multiembed') url = isTv ? `https://multiembed.mov/?video_id=${currentMediaId}&tmdb=1&s=${currentSeason}&e=${currentEpisode}` : `https://multiembed.mov/?video_id=${currentMediaId}&tmdb=1`;
            else if (server === 'autoembed') url = isTv ? `https://autoembed.co/tv/tmdb/${currentMediaId}-${currentSeason}-${currentEpisode}` : `https://autoembed.co/movie/tmdb/${currentMediaId}`;
            else if (server === '2embed') url = isTv ? `https://www.2embed.cc/embedtv/${currentMediaId}&s=${currentSeason}&e=${currentEpisode}` : `https://www.2embed.cc/embed/${currentMediaId}`;
            else if (server === 'vidbinge') url = isTv ? `https://vidbinge.com/embed/tv/${currentMediaId}/${currentSeason}/${currentEpisode}` : `https://vidbinge.com/embed/movie/${currentMediaId}`;
            else if (server === 'movieapi') url = isTv ? `https://moviesapi.club/tv/${currentMediaId}-${currentSeason}-${currentEpisode}` : `https://moviesapi.club/movie/${currentMediaId}`;

            if(currentAudioType === 'dub' && url) {
                const prefix = url.includes('?') ? '&' : '?';
                url += `${prefix}dub=1&audio=dub&lang=${lang}`;
            }
            return url;

        function updateStreamIframe() {
            if (!currentMediaId) return;
            
            const dMsg = document.getElementById('directPlayMsg');
            if (dMsg) dMsg.remove();
            
            const server = serverSelect ? serverSelect.value : '';

            if (server === 'torrentio' && !currentDirectUrl) {
                loadTorrentioStreams();
                return;
            } else if (server === 'direct_ext') {
                if (!currentDirectUrl) {
                    loadDirectStreams();
                    return;
                } else {
                    handleDirectClick(currentDirectUrl);
                    return;
                }
            } else {
                if (scraperContainer) scraperContainer.classList.add('hidden');
            }
            
            if (videoFrame) videoFrame.classList.add('hidden');
            if (playerLoader) playerLoader.classList.remove('hidden');
            if (loaderMessage) loaderMessage.textContent = "Loading media engine...";
            
            if (clickShield) {
                clickShield.classList.remove('resolved');
                if (currentDirectUrl) clickShield.classList.add('resolved'); 
            }
            
            if (videoFrame) {
                if(isAdShieldActive) {
                    videoFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
                } else { 
                    videoFrame.removeAttribute('sandbox'); 
                }
                videoFrame.src = getStreamUrl();
            }
            
            if (streamStatus) {
                streamStatus.innerHTML = `<i class="ph ph-spinner animate-spin"></i> Connecting to stream...`;
                streamStatus.className = "flex items-center gap-1.5 text-zinc-500 text-xs";
            }
            
            setTimeout(() => {
                if(serverSelect && serverSelect.value === 'torrentio' && !currentDirectUrl) return; 
                if(serverSelect && serverSelect.value === 'direct_ext') return;

                if (playerLoader) playerLoader.classList.add('hidden');
                if (videoFrame) videoFrame.classList.remove('hidden');

                if (streamStatus) {
                    streamStatus.innerHTML = currentDirectUrl
                        ? `<span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]"></span> Direct video loaded &mdash; External player fully supported`
                        : `<span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]"></span> Stream Connected & Secure <span class="text-zinc-500 text-[10px] ml-1 font-normal">(Use player gear icon for specific audio/subs)</span>`;
                    streamStatus.className = "flex items-center gap-1.5 text-green-400 font-medium text-xs";
                }
            }, 1800);
        }
    </script>
</body>
</html>
