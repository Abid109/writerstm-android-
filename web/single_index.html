    <script>
      // Global popup blocker for streaming iframe ad redirects
      const originalWindowOpen = window.open;
      window.open = function(url, windowName, windowFeatures) {
        console.warn("Writerstm Security Shield blocked an unauthorized popup to:", url);
        return null;
      };

      let isUserIntentionalClick = false;
      window.addEventListener('mousedown', () => { isUserIntentionalClick = true; setTimeout(() => isUserIntentionalClick = false, 1500); });
      window.addEventListener('keydown', () => { isUserIntentionalClick = true; setTimeout(() => isUserIntentionalClick = false, 1500); });

      window.addEventListener('beforeunload', (e) => {
        if (!isUserIntentionalClick && document.activeElement && document.activeElement.tagName === 'IFRAME') {
          e.preventDefault();
          e.returnValue = 'Warning: A third-party stream attempted to redirect you.';
          return e.returnValue;
        }
      });
