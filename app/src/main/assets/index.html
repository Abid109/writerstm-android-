    <script>
      /* Safe Storage Shim for local file:// & content:// origins in Android WebView APK */
      (function() {
        try {
          if (!window.localStorage) throw new Error();
          window.localStorage.setItem('__test__', '1');
          window.localStorage.removeItem('__test__');
        } catch (e) {
          var mem = {};
          var fakeStorage = {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
            setItem: function(k, v) { mem[k] = String(v); },
            removeItem: function(k) { delete mem[k]; },
            clear: function() { mem = {}; },
            key: function(i) { return Object.keys(mem)[i] || null; },
            get length() { return Object.keys(mem).length; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: fakeStorage, writable: false, configurable: true });
          } catch (e2) {
            window.localStorage = fakeStorage;
          }
        }
      })();

      /* Android APK Status Bar & Notch Detection */
      (function() {
        try {
          var savedNotch = window.localStorage ? window.localStorage.getItem('writerstm_notch') : null;
          var offset = '0px';
          if (savedNotch && savedNotch !== 'auto') {
            offset = savedNotch;
          } else {
            var isAndroid = /Android/i.test(navigator.userAgent);
            var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
              window.navigator.standalone ||
              /Android.*(wv|\.0\.0\.0)/i.test(navigator.userAgent);
            if (isAndroid || isStandalone) {
              offset = '32px';
            }
          }
          document.documentElement.style.setProperty('--status-bar-offset', offset);
        } catch (err) {}
      })();

      /* Performance / Lite Mode Auto-detection for low-end hardware */
      (function() {
        try {
          var savedPerf = window.localStorage ? window.localStorage.getItem('writerstm_perf') : null;
          var isLowEnd = false;
          if (savedPerf !== null) {
            isLowEnd = savedPerf === 'true';
          } else {
            isLowEnd = typeof navigator !== 'undefined' &&
              ((navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
               (navigator.deviceMemory && navigator.deviceMemory <= 3));
          }
          if (isLowEnd) {
            document.documentElement.classList.add('perf-lite');
          }
        } catch (e) {}
      })();

      /* Intelligent Ad Shield & Background Popup Blocker for Streaming Iframes */
      (function() {
        var originalWindowOpen = window.open;
        window.__writerstmAllowNextOpen = false;

        // Whitelist legitimate streaming and media domains that the user may open intentionally
        var trustedDomains = [
          'vidsrc.to', 'vidsrc.me', 'vidsrc.su', 'vidsrc.pm', 'vidsrc.net', 'vidsrc.xyz',
          'autoembed.co', '2embed.cc', '2embed.skin', 'player.smashy.stream',
          'vidlink.pro', 'archive.org', 'themoviedb.org', 'tmdb.org'
        ];

        window.open = function(url, windowName, windowFeatures) {
          // If explicitly triggered by user action in Writerstm UI (e.g. Open Tab, Launch 1DM/VLC)
          if (window.__writerstmAllowNextOpen) {
            window.__writerstmAllowNextOpen = false;
            return originalWindowOpen ? originalWindowOpen.call(window, url, windowName, windowFeatures) : null;
          }

          // If the URL is an authorized media stream domain
          if (url && typeof url === 'string') {
            try {
              var parsed = new URL(url, window.location.href);
              var isAllowed = trustedDomains.some(function(d) {
                return parsed.hostname === d || parsed.hostname.endsWith('.' + d);
              });
              if (isAllowed) {
                return originalWindowOpen ? originalWindowOpen.call(window, url, windowName, windowFeatures) : null;
              }
            } catch (err) {}
          }

          // Otherwise, INTERCEPT AND DO NOT OPEN THE AD DIRECTLY!
          console.warn("🛡️ Writerstm Ad Shield intercepted popup attempt:", url);

          // Dispatch event to show the Ad Warning Modal
          try {
            window.dispatchEvent(new CustomEvent('writerstm-ad-intercepted', {
              detail: { url: url || 'Unknown ad script / popup' }
            }));
          } catch (e) {}

          return null;
        };

        // Prevent iframes from navigating the top window away to ad sites
        window.addEventListener('beforeunload', function(e) {
          if (window.__writerstmAllowNavigation) return;
          var active = document.activeElement;
          if (active && active.tagName === 'IFRAME') {
            e.preventDefault();
            e.returnValue = 'Ad redirect blocked. Stay on Writerstm Stream?';
            try {
              window.dispatchEvent(new CustomEvent('writerstm-ad-intercepted', {
                detail: { url: 'Redirect hijacked by ad script' }
              }));
            } catch (err) {}
            return e.returnValue;
          }
        });
      })();
